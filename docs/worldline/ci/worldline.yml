name: Worldline platform

on:
  push:
    paths: ['worldline/**', 'tests/**', 'examples/**', 'pyproject.toml', '.github/workflows/worldline.yml']
  pull_request:
    paths: ['worldline/**', 'tests/**', 'examples/**', 'pyproject.toml', '.github/workflows/worldline.yml']

permissions:
  contents: read

jobs:
  platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[rua,cua,handoff,dev]'
      - run: python -m playwright install --with-deps chromium
      - run: python3 -m unittest discover -s tests -v
      - run: ruff check worldline tests
      - run: ruff format --check worldline tests
