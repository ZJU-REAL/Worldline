schema_version = "worldline.task/0.1"
[task]
id = "rua/managed-session"
domain = "rua"
environment = "rua.managed"
split = "train"
seed = 0
[environment]
source_revision = "REPLACE_WITH_PINNED_SIMULATOR_AND_TASK_REVISION"
request_timeout_sec = 10
max_image_bytes = 67108864
[environment.provider]
command = ["/path/to/simulator-python", "-m", "worldline.adapters.rua.provider", "--request", "{request_file}", "--ready", "{ready_file}", "--command-file", "/path/to/simulator-command.json"]
startup_timeout_sec = 90
[evaluation]
timeout_sec = 1800
max_actions = 100
max_turns = 100
reset_budget = 0
[metadata]
purpose = "integration_template"
split_group = "REPLACE_WITH_SOURCE_SCENE_GROUP"
[metadata.resources]
min_cpus = 4
gpu_required = true
