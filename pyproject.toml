[project]
name = "worldline-agent"
version = "0.1.0"
description = "Unified evaluation, distillation, and training for sandboxed agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.15"   # Harbor's dependency fastuuid has no wheel for newer Pythons yet
dependencies = ["harbor==0.23.0"]

[project.urls]
Upstream = "https://github.com/mll-lab-nu/embodied-first-exam"

[project.scripts]
efe = "efe:main"
worldline = "worldline.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worldline"]

[tool.hatch.build.targets.wheel.force-include]
"scripts/efe.py" = "efe.py"
"scripts/efe_harbor_hook.py" = "efe_harbor_hook.py"
"scripts/efe-harbor.pth" = "efe-harbor.pth"

[tool.hatch.build.targets.sdist]
only-include = ["scripts/efe.py", "scripts/efe_harbor_hook.py", "scripts/efe-harbor.pth", "worldline", "LICENSE", "README.md"]
