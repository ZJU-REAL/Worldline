[project]
name = "worldline-agent"
version = "0.7.0"
description = "Unified evaluation, distillation, and training for sandboxed agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.15"   # Harbor's dependency fastuuid has no wheel for newer Pythons yet
dependencies = []

[project.optional-dependencies]
harbor = ["harbor==0.23.0"]
rua = ["mujoco==3.3.7", "numpy>=2,<3", "pillow>=11,<12"]
cua = ["browsergym-core==0.14.3"]
handoff = ["pyarrow>=19,<27", "pillow>=11,<12"]
training = ["torch>=2.5,<3", "transformers>=4.51,<5", "datasets>=3,<5", "accelerate>=1,<2"]
dev = ["ruff==0.14.5"]
serving = ["vllm>=0.11,<1; python_version < '3.14'"]

[project.urls]
Repository = "https://github.com/ZJU-REAL/Worldline"
Upstream = "https://github.com/mll-lab-nu/embodied-first-exam"

[project.scripts]
worldline = "worldline.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worldline"]

[tool.hatch.build.targets.wheel.force-include]
"examples/rua/reach-test" = "worldline/suites/tasks/rua/reach-test"
"examples/cua/form-test" = "worldline/suites/tasks/cua/form-test"

[tool.hatch.build.targets.sdist]
only-include = ["worldline", "examples", "tests", "docs/worldline", ".githooks", ".dockerignore", "AGENTS.md", "LICENSE", "README.md", "CONTRIBUTING.md"]

[tool.ruff]
line-length = 120
target-version = "py312"
